name: money_plant
description: "Your private money garden. Track, plan, split, and grow."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  cupertino_icons: ^1.0.9
  shared_preferences: ^2.5.3
  intl: ^0.20.3
  uuid: ^4.5.3
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^12.0.1
  package_info_plus: ^9.0.0
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/notifications/garden-reminder.png
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
