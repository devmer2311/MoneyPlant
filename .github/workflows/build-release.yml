name: App version pipeline
on:
  push:
    branches: [dev, main]
    paths: ['versions/app.yaml']
  pull_request:
    branches: [dev, main]
    paths: ['versions/app.yaml']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read version and compare with event base
        id: version
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE" ]]; then BASE="$(git rev-parse HEAD^)"; fi
          python3 tool/component_version.py app --base "$BASE" --output "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: node site/scripts/release-notes.mjs "$TAG" release-notes.md
      - name: Configure release signing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS" || { echo 'Configure the four Android signing secrets listed in README.md.'; exit 1; }
          echo "$KEYSTORE" | base64 --decode > android/app/release.jks
          python3 - <<'PY'
          import os
          from pathlib import Path
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('=', '\\=').replace(':', '\\:').replace(' ', '\\ ')
          lines = ['storeFile=release.jks']
          for prop, key in [('storePassword','STORE_PASSWORD'), ('keyPassword','KEY_PASSWORD'), ('keyAlias','KEY_ALIAS')]:
              lines.append(f'{prop}={escape(os.environ[key])}')
          Path('android/key.properties').write_text('\n'.join(lines) + '\n')
          PY
      - name: Validate app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          python3 tool/test_component_version.py
          python3 tool/test_verify_release.py
      - name: Build development APK
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: flutter build apk --debug --build-name="$VERSION" --build-number="$BUILD"
      - name: Build and verify signed production APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          flutter build apk --release --build-name="$VERSION" --build-number="$BUILD" --dart-define=MONEY_PLANT_WEBSITE_URL=https://moneyplantbydev.pages.dev
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -n "$AAPT"
          python3 tool/verify_release.py build/app/outputs/flutter-apk/app-release.apk "$VERSION+$BUILD" --aapt "$AAPT"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ needs.version.outputs.version }}-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            release-notes.md
          if-no-files-found: error
          retention-days: 14
      - name: Clean signing material
        if: always()
        run: rm -f android/key.properties android/app/release.jks

  release:
    needs: [version, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: app-${{ needs.version.outputs.version }}-${{ github.sha }}
          path: validated
      - name: Publish only verified bytes from this main commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          APK="validated/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          cp "$APK" "money-plant-v$VERSION+$BUILD.apk"
          cp "$APK" money-plant.apk
          sha256sum "money-plant-v$VERSION+$BUILD.apk" > "money-plant-v$VERSION+$BUILD.apk.sha256"
          gh release create "$TAG" "money-plant-v$VERSION+$BUILD.apk" money-plant.apk "money-plant-v$VERSION+$BUILD.apk.sha256" --target "$GITHUB_SHA" --title "Money Plant $TAG" --draft --notes-file validated/release-notes.md
          mkdir release-check
          gh release download "$TAG" --dir release-check --pattern '*.apk' --pattern '*.sha256'
          (cd release-check && sha256sum --check "money-plant-v$VERSION+$BUILD.apk.sha256")
          cmp "release-check/money-plant-v$VERSION+$BUILD.apk" release-check/money-plant.apk
          cmp "release-check/money-plant-v$VERSION+$BUILD.apk" "$APK"
          gh release edit "$TAG" --draft=false
