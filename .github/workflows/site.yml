name: Site version pipeline
on:
  push:
    branches: [dev, main]
    paths: ['versions/site.yaml']
  pull_request:
    branches: [dev, main]
    paths: ['versions/site.yaml']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read version and compare with event base
        id: version
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE" ]]; then BASE="$(git rev-parse HEAD^)"; fi
          python3 tool/component_version.py site --base "$BASE" --output "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run check
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRE_FRESH_RELEASES: '1'
          SITE_VERSION: ${{ needs.version.outputs.version }}
      - name: Record artifact version
        env:
          SITE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('site/dist/site-version.json').write_text(json.dumps({'version': os.environ['SITE_VERSION'], 'commit': os.environ['GITHUB_SHA']}) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ needs.version.outputs.version }}-${{ github.sha }}
          path: site/dist
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: [version, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: site-${{ needs.version.outputs.version }}-${{ github.sha }}
          path: site/dist
      - name: Deploy production site
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=moneyplantbydev --branch=main
      - name: Record deployed site version at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
